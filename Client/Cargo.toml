[package]
name = "Client"
version = "0.1.0"
edition = "2021"

[dependencies]
jack = "0.13.4"
opus = "0.3.1"
ringbuf = "0.4.8"
tokio = { version = "1", features = ["full"] }
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
rand = "0.8"
byteorder = "1.5"
axum = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower-http = { version = "0.5", features = ["fs"] }